[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens API service"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic-settings==2.9.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
